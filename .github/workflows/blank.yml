name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q 'AutoAnswer*'
      - run: |
          echo "android.useAndroidX=true" > AutoAnswer/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2g" >> AutoAnswer/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd AutoAnswer && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: AutoAnswer/app/build/outputs/apk/debug/app-debug.apk
